[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-anomaly"
version = "0.1.0"
description = "Robust first-stage energy anomaly detection for time series"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "plotly>=5.18",
    "numba>=0.58",
    "ssqueezepy>=0.6.5",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# SAM 2 itself is installed from Meta's repository; this extra documents the
# local PyTorch prerequisite without making the experiment mandatory.
sam = ["torch>=2.5"]
gpu = ["torch>=2.5", "cuml-cu12>=25.2; platform_system == 'Linux'"]
io = ["pyarrow>=14"]
hdbscan = ["hdbscan>=0.8.33"]

[project.scripts]
spectral-anomaly = "spectral_anomaly.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
